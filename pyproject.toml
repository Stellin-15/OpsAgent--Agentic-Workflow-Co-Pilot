[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opsagent"
version = "0.1.0"
description = "Open-source AI SRE co-pilot: alert fires → AI reads your runbooks → drafts a fix → human approves → actions run"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Validation & config
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-ulid>=3.0.0",
    # LLM & RAG (Phase 1: FAISS; Phase 4: pgvector)
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-text-splitters>=0.3.0",
    "faiss-cpu>=1.9.0",
    # Logging
    "structlog>=24.4.0",
    # Async task queue (Phase 2)
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    # Integrations
    "slack-sdk>=3.33.0",
    "slack-bolt>=1.21.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    # Phase 4: pgvector, multi-model LLM, hybrid retrieval, eval, streaming
    "pgvector>=0.3.0",
    "google-generativeai>=0.8.0",
    "anthropic>=0.40.0",
    "openai>=1.55.0",
    "rank-bm25>=0.2.2",
    # Phase 4: evaluation & tracking (optional — graceful fallback if missing)
    # "ragas>=0.2.0",
    # "mlflow>=2.18.0",
    # "datasets>=3.0.0",
    # Phase 5: observability
    "prometheus-client>=0.21.0",
    # Optional OTel — uncomment for distributed tracing:
    # "opentelemetry-sdk>=1.28.0",
    # "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    # "opentelemetry-instrumentation-fastapi>=0.49b0",
    # Phase 6: JWT auth + Stripe billing
    "pyjwt>=2.10.0",
    "stripe>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "flower>=2.0.0",        # Celery task monitoring UI
]
eval = [
    "ragas>=0.2.0",
    "mlflow>=2.18.0",
    "datasets>=3.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
