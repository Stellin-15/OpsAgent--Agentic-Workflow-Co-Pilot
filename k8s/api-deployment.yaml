apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsagent-api
  namespace: opsagent
  labels:
    app: opsagent-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opsagent-api
  template:
    metadata:
      labels:
        app: opsagent-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/opsagent:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: opsagent-config
            - secretRef:
                name: opsagent-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: opsagent-api
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: runbooks
              mountPath: /app/runbooks
              readOnly: true
            - name: actions
              mountPath: /app/actions
              readOnly: true
      volumes:
        - name: runbooks
          configMap:
            name: opsagent-runbooks
        - name: actions
          configMap:
            name: opsagent-actions
---
apiVersion: v1
kind: Service
metadata:
  name: opsagent-api
  namespace: opsagent
spec:
  selector:
    app: opsagent-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
