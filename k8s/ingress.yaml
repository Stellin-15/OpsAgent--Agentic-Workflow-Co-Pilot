apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opsagent-ingress
  namespace: opsagent
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # SSE streams
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"       # disable buffering for SSE
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.opsagent.io
      secretName: opsagent-tls
  rules:
    - host: api.opsagent.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opsagent-api
                port:
                  number: 80
